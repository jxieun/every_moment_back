# --- Server ---
# Render injects PORT env var, default to 8080 for local
server.port=${PORT:8080}

# --- DataSource (H2 In-Memory for Demo) ---
spring.datasource.url=jdbc:h2:mem:dormdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Flyway ---
spring.flyway.enabled=false

# --- JWT ---
jwt.secret=${JWT_SECRET:change-me-to-a-very-long-256bit-secret-just-for-demo-purposed-1234567890}
jwt.access-token-seconds=3600
jwt.refresh-token-seconds=1209600

# --- Logging / OpenAPI ---
logging.level.org.springframework.security=INFO
logging.level.com.rookies4=INFO
